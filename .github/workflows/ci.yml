name: Rust CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, Lint, Check, Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse generated dumps and agent plans
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -eu
          range=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            printf '%s' "$BASE_SHA" | grep -Eq '^[0-9a-f]{40}$'
            range="$BASE_SHA HEAD"
          elif printf '%s' "$BEFORE_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            range="$BEFORE_SHA HEAD"
          fi
          if [ -z "$range" ]; then
            exit 0
          fi
          # shellcheck disable=SC2086
          names=$(git diff --name-only --diff-filter=A $range || true)
          bad=$(printf '%s\n' "$names" | grep -E \
            '^(docs/superpowers/|eval/component0/runs/)|contextd_component2(_claims|_report|_events)?\.(txt|json|jsonl)$' \
            || true)
          if [ -n "$bad" ]; then
            printf 'These paths are generated dumps or agent plans and must not be committed:\n%s\n' "$bad" >&2
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Type-check and compile checks
        run: cargo check --workspace --all-targets --all-features

      - name: Run tests
        run: cargo test --workspace --all-features

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install extraction test dependencies
        run: python -m pip install pytest==9.1.1 pyyaml==6.0.3 tiktoken==0.14.0

      - name: Run extraction and admission tests
        working-directory: eval/component0
        run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest tests/test_extract_claims.py tests/test_import_trajectory.py tests/test_arms.py tests/test_natural_trajectory.py -q --tb=line -p pytest
