name: Rust CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, Lint, Check, Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Refuse generated dumps and agent plans
        run: |
          set -eu
          tracked=$(git ls-files)
          bad=$(printf '%s\n' "$tracked" | grep -E \
            '^(docs/superpowers/|eval/component0/runs/)|contextd_component2(_claims|_report)?\.(txt|json)$' \
            || true)
          if [ -n "$bad" ]; then
            printf 'These paths are generated dumps or agent plans and must not be committed:\n%s\n' "$bad" >&2
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Type-check and compile checks
        run: cargo check --workspace --all-targets --all-features

      - name: Run tests
        run: cargo test --workspace --all-features
