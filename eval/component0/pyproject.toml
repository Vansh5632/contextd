[project]
name = "contextd-component0-eval"
version = "0.0.0"
description = "Host-side harness for the contextd Component 0 evaluation benchmark."
requires-python = ">=3.12"
dependencies = [
    "pytest==9.1.1",
    "pyyaml==6.0.3",
    "tiktoken==0.14.0",
]

[tool.ruff]
line-length = 100
extend-exclude = ["episodes", "build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-p", "no:cacheprovider"]
