# Relative to eval/component0.
[paths]
cache = "build/cache/httpcore.git"
workspace_root = "build/workspace"

# Relative to the episode directory. Plant patches are applied in order before
# the import commit; the followup patch becomes the second commit.
[episode]
name = "limiter-handoff"
plant_patches = [
    "patches/bug.patch",
    "patches/remove_covering_test.patch",
    "patches/session_b_bug.patch",
]
followup_patch = "patches/session_b_fix.patch"
visible_test = "visible/test_pool_counts.py"
visible_test_dest = "tests/test_pool_counts.py"
fix_patch = "gold/fix.patch"
hidden_tests = "gold/hidden_tests"
leak_terms = "gold/leak_terms.yaml"

# Context-packet arms (harness.arms). Token counts use the tiktoken encoding below.
[arms]
names = ["none", "raw", "summary", "oracle", "stale-only", "contextd", "contextd-new"]
raw_budget_tokens = 8192
tokenizer = "o200k_base"

