[repo]
url = "https://github.com/encode/httpcore.git"
sha = "98209758cc14e1a5f966fe1dfdc1064b94055d8c"
tag = "1.0.9"

[git]
author_name = "dev"
author_email = "dev@example.invalid"
default_branch = "main"
import_message = "import"
import_date = "2026-09-14T10:12:00+00:00"
followup_message = "models: fix default port check in host header"
