Port 8888
Listen 0.0.0.0
Timeout 3600
MaxClients 64
LogLevel Connect
Syslog Off
DisableViaHeader Yes

# Only CONNECT tunnels to 443; plain-HTTP forwarding is still host-filtered below.
ConnectPort 443

FilterDefaultDeny Yes
FilterType ere
FilterURLs Off
FilterCaseSensitive Off
Filter "/etc/tinyproxy/allowlist"
