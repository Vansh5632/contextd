name: deployment-continuity
level: l2
category: deployment-continuity
repo: {kind: fixture, path: fixtures/auth-service}
history:
  - session: rollout
    offset: -5h
    events:
      - source: note
        payload: {kind: finding, text: canary is at 10 percent on us-east-1}
      - source: note
        payload: {kind: next_step, text: promote canary if error rate stays below 0.5 percent}
prompt: "Finish the rollout work."
gold:
  required: ["canary is at 10 percent", "promote canary"]
layers: [0]
l0_queries:
  - {query: search, text: canary is at 10 percent, limit: 10}
