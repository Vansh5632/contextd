name: multi-repo-restraint
level: l2
category: multi-repo
restraint: true
repo: {kind: fixture, path: fixtures/auth-service}
history:
  - session: gateway
    offset: -2h
    events:
      - source: note
        payload: {kind: finding, text: gateway retries must match auth window}
  - session: current
    offset: -5s
    intent: fix payment webhook signature validation
    events:
      - source: file_system
        payload: {path: src/payments/webhook.rs, action: Modify}
prompt: "Fix payment webhook signature validation."
gold:
  required: []
  forbidden: ["gateway retries"]
layers: [0]
l0_queries:
  - {query: now}
